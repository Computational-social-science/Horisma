implementation: horisma_p0.live_ledger.Ledger
storage: Project-owned immutable entity/snapshot objects with atomic HEAD replacement
writer: Single exclusive writer lock; stale-lock recovery not implemented
facets:
  declared: [SATISFIED, PENDING, REJECTED]
  effective: [SATISFIED, PENDING, REJECTED, STALE]
